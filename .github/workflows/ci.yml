name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # No deps to install (stdlib only) — run the checks directly.
      - name: Syntax-check skill and repo scripts
        run: find skills scripts -name '*.mjs' -print -exec node --check {} +
      # packaging smoke check + unit tests (scripts/verify.mjs; Go and console run in their own jobs)
      - name: Verify
        run: npm run verify

  platform-go:
    runs-on: ubuntu-latest
    # The queue, runtime, monitor and importer tests need a real Postgres; MS_REQUIRE_DB
    # makes them fail when the service is unreachable.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ms
          # throwaway service container for one job; trust auth means no credential is committed
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ms_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U ms -d ms_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: platform
    env:
      MS_TEST_DATABASE_URL: postgres://ms@127.0.0.1:5544/ms_test
      # a missing database fails the job instead of skipping every DB test
      MS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - name: Go tests (race detector, one package at a time because they share the database)
        run: go test -p 1 -race -count=1 ./...

  platform-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v4
      # the console is locked with pnpm (pnpm-lock.yaml), so npm ci has no lockfile to install from
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck

  console-e2e:
    # Builds the console and drives every route family in WebKit against an isolated Go stack.
    # Only test ports (Postgres 15544, API 18080, console 13000) and test tokens. MS_ENGINE_URL stays
    # unset and no provider key or notification token is set: the browser stubs the engine routes.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ms
          # throwaway service container for one job; trust auth means no credential is committed
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ms_e2e
        ports:
          - 15544:5432
        options: >-
          --health-cmd "pg_isready -U ms -d ms_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: platform/web
    env:
      MS_DATABASE_URL: postgres://ms@127.0.0.1:15544/ms_e2e
      MS_API_ADDR: 127.0.0.1:18080
      # next.config.ts reads MS_API_URL when it loads, so the build and the start step see the same value
      MS_API_URL: http://127.0.0.1:18080
      MS_WORKER_TOKEN: e2e-worker-token
      MS_INGEST_TOKEN: e2e-ingest-token
      E2E_BASE_URL: http://127.0.0.1:13000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # the smoke step launches WebKit without a fallback, so a missing browser fails the job
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: Build console (next build)
        run: pnpm build
      # the services run in the background for the rest of the job; their logs go to the failure artifact
      - name: Start Go API and worker
        working-directory: platform
        run: |
          go build -o "$RUNNER_TEMP/ms-api" ./cmd/api
          go build -o "$RUNNER_TEMP/ms-worker" ./cmd/worker
          "$RUNNER_TEMP/ms-api" -seed > "$RUNNER_TEMP/api.log" 2>&1 &
          curl -fsS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 "$MS_API_URL/api/v1/health"
          "$RUNNER_TEMP/ms-worker" -id e2e-worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo "Go API on $MS_API_ADDR, worker started"
      # seed.sh must refuse every API but the lane's 18080 and every database but the lane's ms_e2e on
      # 15544 before its first write; the accepted lane values are proven by the Seed test data step
      - name: Seed refuses a non-lane database or API
        run: |
          refuses() { # expected message, then env arguments for one seed.sh run
            local msg="$1"; shift
            if env "$@" ./e2e/seed.sh 2> "$RUNNER_TEMP/seed-refusal.log"; then echo "seed.sh accepted $*"; exit 1; fi
            grep -q "$msg" "$RUNNER_TEMP/seed-refusal.log" || { echo "seed.sh did not refuse $* with: $msg"; exit 1; }
          }
          db='MS_DATABASE_URL must be the console-e2e test database'
          api='MS_API_URL must be unset or the console-e2e API'
          for url in "" postgres://ms@127.0.0.1:5544/ms postgres://ms@127.0.0.1:15544/ms postgres://ms@127.0.0.1:5544/ms_e2e \
            'postgres://ms@prodhost:5432/ms?application_name=x@127.0.0.1:15544/ms_e2e'; do
            refuses "$db" MS_DATABASE_URL="$url"
          done
          for url in http://127.0.0.1:8080 http://localhost:8080 http://127.0.0.1:18080.evil http://example.com; do
            refuses "$api" MS_API_URL="$url"
          done
          # an unset or empty MS_API_URL passes the API guard, so the run stops at the database guard
          refuses "$db" -u MS_API_URL MS_DATABASE_URL=postgres://ms@127.0.0.1:5544/ms
          refuses "$db" MS_API_URL= MS_DATABASE_URL=postgres://ms@127.0.0.1:5544/ms
      - name: Seed test data
        run: ./e2e/seed.sh
      - name: Start console (next start)
        run: |
          pnpm exec next start -p 13000 -H 127.0.0.1 > "$RUNNER_TEMP/console.log" 2>&1 &
          curl -fsS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 "$E2E_BASE_URL/"
          echo "console on $E2E_BASE_URL, proxying /api/v1 to $MS_API_URL"
      - name: Route-family smoke (WebKit)
        run: pnpm e2e
        env:
          E2E_OUT: ${{ runner.temp }}/console-e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-e2e-failures
          path: |
            ${{ runner.temp }}/console-e2e
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
