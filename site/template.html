<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="./"><img src="assets/favicon.svg" alt="" width="22" height="22">Market Signals</a>
    <nav aria-label="Main">{{nav}}<a href="https://github.com/mfittko/market-signals">GitHub</a></nav>
  </div>
</header>
<main class="page">
{{body}}
</main>
<footer class="foot">
  <p>Paper money only. This is software built in the open. It gives no financial advice and makes no claim about returns.</p>
  <p>Developed with <a href="https://mfittko.github.io/dev-loops/">dev-loops</a>.</p>
</footer>
<dialog class="lightbox" aria-label="Screenshot"><img alt=""><p><span></span><button type="button">Close</button></p></dialog>
<script>
// Open screenshots in a lightbox. currentSrc is the light or dark image the browser already picked.
(() => {
  const box = document.querySelector('dialog.lightbox');
  if (!box || !box.showModal) return;
  const img = box.querySelector('img'), cap = box.querySelector('span');
  // Point the link at the image the browser picked, so a new tab from any click or the context menu matches the color scheme.
  const point = (e) => {
    const a = e.target.closest('figure.shot a');
    if (a) a.href = a.querySelector('img').currentSrc || a.querySelector('img').src;
    return a;
  };
  document.addEventListener('auxclick', point);
  document.addEventListener('contextmenu', point);
  document.addEventListener('click', (e) => {
    const a = point(e);
    if (!a) return;
    const shot = a.querySelector('img');
    // Modified clicks and small screens follow the link; phones can pinch-zoom it.
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || innerWidth < 700) return;
    e.preventDefault();
    img.src = shot.currentSrc || shot.src;
    img.alt = shot.alt;
    cap.textContent = a.closest('figure').querySelector('figcaption')?.textContent || shot.alt;
    box.showModal();
  });
  box.addEventListener('click', () => box.close());
})();
</script>
</body>
</html>
