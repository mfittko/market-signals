<style>

  .msg.user { background: #1f6feb22; border: 1px solid #1f6feb55; align-self: flex-end; }
  .msg.assistant { background: #161b22; border: 1px solid #30363d; align-self: flex-start; }
  .msg.error { background: #f8514922; border: 1px solid #f8514955; align-self: flex-start; }
  .msg code { background: #010409; border: 1px solid #21262d; border-radius: 3px; padding: 0 4px; font-size: 12px; }
  .msg pre { background: #010409; border: 1px solid #21262d; border-radius: 5px; padding: 8px; overflow-x: auto; margin: 6px 0; }
  .msg table { margin: 6px 0; font-size: 12px; } .msg td { padding: 2px 8px; border-bottom: 1px solid #21262d; }

  #chatForm button:hover { background: #33914f; } #chatForm button:active { background: #235f37; }

  #app.chat-collapsed { grid-template-columns: 1fr; }
  #app.chat-collapsed > aside, #app.chat-collapsed > #asideResize { display: none; }

  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; }

    table { display: block; overflow-x: auto; white-space: nowrap; }

  h1 { font-size: 16px; } h2 { font-size: 14px; margin: 20px 0 8px; }
  #pf { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; margin: 10px 0; }
  #pf summary { cursor: pointer; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  #pf summary button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  #pfChips b, #pfChips span { margin-right: 12px; }
  #pfSpark { max-width: 100%; height: 46px; display: block; }
  .pfcard { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; margin: 6px 0; font-size: 13px; }
  .pfcard .why { color: #8b949e; font-size: 12px; margin-top: 4px; }
  #pfdlg { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; min-width: min(640px, 92vw); max-height: 85vh; overflow-y: auto; }
  .halted { color: #f85149; font-weight: 600; } .active { color: #3fb950; font-weight: 600; }
  #pfTabs, #bmTabs, #cfgTabs, #gatesTabs { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  #pfTabs button, #bmTabs button, #cfgTabs button, #gatesTabs button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 5px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  #pfTabs button.on, #bmTabs button.on, #cfgTabs button.on, #gatesTabs button.on { background: #1f6feb33; border-color: #1f6feb; }
  /* a11y (#126): a consistent high-contrast keyboard focus ring on every
     interactive control (native rings still apply; this makes it uniform). */
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #58a6ff; outline-offset: 2px; }
  /* a11y (#126): keep the smaller chip/row buttons at/above the 24px min target.

  #pfTabs button, #bmTabs button, #cfgTabs button, #gatesTabs button, #threadBar button, .botrow .jump, #pf summary button { min-height: 26px; }
  /* a11y (#126): honor reduced-motion — drop the hover/state transitions. */
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
  /* #108: panels use display:contents so their label/input pairs join the form's

  .cfgpanel { display: contents; }
  .cfgpanel[hidden] { display: none; }
  .cfgfoot { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 12px; }
  /* #108/#110: wider default + a 220px label column so long NEWSAPI_AI_* labels fit
     one line. The #cfg id selector outweighs the generic dialog-form collapse in the
     max-width:900px query, so an explicit #cfg override there restores single-column. */
  #cfgdlg { width: min(680px, 92vw); }
  #cfg { grid-template-columns: 220px 1fr; max-width: none; }
  @media (max-width: 900px) { #cfg { grid-template-columns: 1fr; } }
  #cfgTabs .dirty { color: #d29922; font-weight: bold; }
  /* long field keys (e.g. NEWSAPI_AI_REQUEST_BUDGET) wrap in the label column instead of clipping */

  #botBtn { position: relative; }

  #botBtn.dot-grey::after { display: block; background: #8b949e; }
  #botBtn.dot-green::after { display: block; background: #3fb950; }
  #botBtn.dot-amber::after { display: block; background: #d29922; }

  #haltBanner { background: #f8514922; border: 1px solid #f85149; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; color: #f85149; font-weight: 600; }

  #botdlg { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; width: min(720px, 92vw); }

  .memempty, .gateempty { color: #8b949e; font-size: 13px; }
  .gaterow { border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; margin: 8px 0; }

  .gaterow textarea { width: 100%; box-sizing: border-box; min-height: 90px; margin-top: 4px; }
  .botrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid #30363d; border-radius: 6px; padding: 7px 10px; margin: 6px 0; font-size: 13px; flex-wrap: wrap; }

  #hdr2 { display: flex; flex-basis: 100%; gap: 14px; align-items: center; flex-wrap: wrap; }

  #oscwrap { background: #010409; border: 1px solid #30363d; border-radius: 6px; padding: 4px; margin-top: 6px; }

  table { border-collapse: collapse; width: 100%; } td, th { padding: 4px 8px; text-align: left; border-bottom: 1px solid #21262d; }
  tr { cursor: pointer; } tr:hover { background: #161b22; }
  form { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; max-width: 520px; }
  #gatesList pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  #cfgAdv { grid-column: 1 / -1; }
  #cfgAdv summary { cursor: pointer; color: #8b949e; margin: 4px 0; }
  .advgrid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; margin-top: 6px; }
  /* one control height everywhere interactive chrome lives (#56) */
  #topbar select, #topbar button, dialog input:not([type=checkbox]), dialog select, dialog button:not(.dlg-x) { height: 30px; box-sizing: border-box; }
  dialog textarea { box-sizing: border-box; }
  input, select, textarea { background: #010409; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 4px 6px; }
  /* #87: one shared primary-green treatment — calmer green, readable weight,
     subtle hover/active. Bare <button> is primary; secondary/destructive controls
     opt out by overriding background at their own (id/class) specificity.
     The green :hover/:active live in :where() so they carry ZERO specificity —
     any secondary's own rest rule outranks them on every state, so nothing has to
     "out-specify the blanket" to stay grey. :not(.dlg-x) spares the borderless ×. */
  button { grid-column: 2; justify-self: start; padding: 5px 14px; background: #2b7a45; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-weight: 500; transition: background .12s ease; }
  :where(button:not(.dlg-x)):hover { background: #33914f; }
  :where(button:not(.dlg-x)):active { background: #235f37; }
  button:disabled { opacity: 0.5; cursor: default; }
  /* lighter-grey hover affordance for the subordinate controls (never the active tab) */
  #cfgbtn:hover, #chatToggle:not(.on):hover, .botrow .jump:hover, #threadBar button:hover, #pfTabs button:not(.on):hover, #bmTabs button:not(.on):hover, #pf summary button:hover { background: #2a313a; border-color: #3d444d; }
  /* destructive: red text, no fill on every state */
  #bmRemove { float: right; color: #f85149; background: none; border: 0; }
  #bmRemove:hover, #bmRemove:active { background: none; color: #ff7b72; }
  #saved { color: #3fb950; margin-left: 8px; }
  #watchBtn { background: none; border: 1px solid #30363d; border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 15px; }
  #cfgbtn, #chatToggle { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
            border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  /* #57: info overlay — CSS-only tooltip, no JS positioning; [data-info] gets a
     positioning context whether the toggle is on or off (no reflow on toggle). */
  [data-info] { position: relative; }
  body.info-on [data-info]:not(button):not(label):not(select):not(input) { cursor: help; }
  @media (hover: hover) {
  /* ::before, NOT ::after — #botBtn's status dot lives on ::after and the rules would merge */
  body.info-on [data-info]:hover::before, body.info-on [data-info]:focus::before {
    content: attr(data-info); position: absolute; left: 0; top: 100%; margin-top: 4px;
    width: max-content;
    background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 6px 9px;
    font-size: 12px; line-height: 1.45; white-space: normal; max-width: 260px;
    z-index: 5; color: #e6edf3; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  }
  @media (hover: hover) and (max-width: 480px) {
    body.info-on [data-info]:hover::before, body.info-on [data-info]:focus::before {
      max-width: calc(100vw - 32px);
    }
  }
  dialog { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px;
           padding: 18px 20px; min-width: min(420px, 92vw); max-width: 92vw; box-sizing: border-box; position: relative; }
  dialog::backdrop { background: rgba(1, 4, 9, 0.7); }
  dialog h2 { margin-top: 0; }
  .dlg-x { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: #8b949e;
           font-size: 18px; line-height: 1; padding: 4px 6px; cursor: pointer; height: auto;
           z-index: 1; /* modal titles are positioned ([data-info]) and would otherwise paint over the × */ }
  .dlg-x:hover { color: #e6edf3; }
  #wrap { position: relative; }
  .quote { display: flex; gap: 22px; flex-wrap: wrap; padding: 8px 14px; border: 1px solid #30363d;
           border-radius: 6px; margin: 10px 0 0; }
  .quote small { display: block; color: #8b949e; font-size: 11px; }
  .quote b { font-size: 15px; }
  #tip { position: absolute; display: none; background: #161b22; border: 1px solid #30363d;

         pointer-events: none; white-space: nowrap; z-index: 2; }

<script>
const qs = new URLSearchParams(location.search);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// #57: one explanation map — single source for every non-obvious metric/term.
// Rendered elements carry data-info="<INFO[key] text>" (the resolved
// explanation, not the key) so CSS alone (content: attr(data-info)) can
// render it as a styled hover tooltip when the ⓘ toggle is on; STATIC_TITLES
// below also derives native title attributes from this same map (baseline,
// always on).
const INFO = {

function sparkline(pf) {
  const c = document.getElementById('pfSpark');
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  // trades arrive newest-first; the curve runs oldest → newest realized equity
  const pts = pf.trades.slice().reverse().reduce((acc, t) => { acc.push(acc[acc.length - 1] + t.realized); return acc; }, [pf.startingBalance]);
  if (pts.length < 2) pts.push(pts[0]);
  const min = Math.min(...pts), max = Math.max(...pts), span = (max - min) || 1;
  g.strokeStyle = pts[pts.length - 1] >= pts[0] ? '#3fb950' : '#f85149';
  g.lineWidth = 1.5;
  g.beginPath();
  pts.forEach((v, i) => {
    const x = (i / (pts.length - 1)) * (c.width - 8) + 4;
    const y = c.height - 6 - ((v - min) / span) * (c.height - 12);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

  const buys = (d.flips || []).filter(f => f.signal === 'buy').map(f => ({ x: P(f.time), y: cs[f.index] ? cs[f.index].low - (cs[f.index].high - cs[f.index].low) : f.price }));
  const sells = (d.flips || []).filter(f => f.signal === 'sell').map(f => ({ x: P(f.time), y: cs[f.index] ? cs[f.index].high + (cs[f.index].high - cs[f.index].low) : f.price }));

  if (chart) chart.destroy();

    data: {
      datasets: [
        { type: 'candlestick', data: candleData, yAxisID: 'y',
          color: { up: '#3fb950', down: '#f85149', unchanged: '#8b949e' },
          borderColor: { up: '#3fb950', down: '#f85149', unchanged: '#8b949e' } },
        { type: 'line', data: stData, yAxisID: 'y', pointRadius: 0, borderWidth: 1.5, tension: 0,
          segment: { borderColor: (c) => (stData[c.p1DataIndex] || {}).trend === 'up' ? '#3fb950' : '#f85149' } },
        { type: 'bar', data: volData, yAxisID: 'vol', backgroundColor: volColor, barPercentage: 0.6 },
        { type: 'scatter', data: buys, yAxisID: 'y', pointStyle: 'triangle', radius: 7, backgroundColor: '#3fb950', borderWidth: 0 },
        { type: 'scatter', data: sells, yAxisID: 'y', pointStyle: 'triangle', rotation: 180, radius: 7, backgroundColor: '#f85149', borderWidth: 0 },
        { type: 'scatter', data: marker, yAxisID: 'y', pointStyle: 'circle', radius: 7, backgroundColor: '#d29922', borderWidth: 0 },
        ...overlays,
      ],
    },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false, parsing: false, normalized: true,
      events: [], // hover is fully owned by fullColumnTooltip (nearest-by-x, full chart height)
      scales: {
        x: { type: 'timeseries', ticks: { color: '#8b949e', maxRotation: 0, autoSkipPadding: 18 },
             grid: { color: 'rgba(48,54,61,0.5)' }, time: { tooltipFormat: 'yyyy-MM-dd HH:mm', displayFormats: { minute: 'HH:mm', hour: 'HH:mm' } } },
        y: { position: 'right', ticks: { color: '#8b949e' }, grid: { color: 'rgba(48,54,61,0.5)' } },
        vol: { position: 'left', display: false, max: maxVol * 5, min: 0 },

          filter: (item) => item.datasetIndex === 0,

// Full-column tooltip target (operator UX request): hovering anywhere at an x
// snaps the tooltip to that candle — no need to hit the body. Implemented as a
// manual nearest-by-x lookup activating ONLY the candle dataset (axis-x
// interaction modes crash the vendored bundle's hover-style resolution on the
// segment/scatter datasets).
function fullColumnTooltip(c) {
  const canvas = c.canvas;
  // draw() rebuilds the chart every refresh on the same canvas: attach once,
  // always act on the live module-level chart binding.
  if (canvas.dataset.fullColTooltip) return;
  canvas.dataset.fullColTooltip = '1';
  canvas.addEventListener('mousemove', (e) => {
    const c2 = chart;
    if (!c2) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const a = c2.chartArea;
    const clear = () => { if (c2.tooltip.getActiveElements().length) { c2.tooltip.setActiveElements([], { x: 0, y: 0 }); c2.tooltip.update(true); c2.draw(); } };
    if (!a || x < a.left || x > a.right || y < a.top || y > a.bottom) return clear();
    const data = c2.data.datasets[0].data;
    if (!data.length) return clear();
    const xVal = c2.scales.x.getValueForPixel(x);
    // candles are time-sorted: binary-search the insertion point, compare neighbors
    let lo = 0, hi = data.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (data[mid].x < xVal) lo = mid + 1; else hi = mid; }
    const best = lo > 0 && Math.abs(data[lo - 1].x - xVal) <= Math.abs(data[lo].x - xVal) ? lo - 1 : lo;
    const cur = c2.tooltip.getActiveElements();
    if (cur.length === 1 && cur[0].index === best) return;
    c2.tooltip.setActiveElements([{ datasetIndex: 0, index: best }], { x, y });
    c2.tooltip.update(true);
    c2.draw();
  });
  canvas.addEventListener('mouseleave', () => { const c2 = chart; if (!c2) return; c2.tooltip.setActiveElements([], { x: 0, y: 0 }); c2.tooltip.update(true); c2.draw(); });
}

function verdict(s, botDecision, recheck, view) {

  const botNote = botDecision ? '<div class="botnote" data-info="' + esc(INFO.botDecision) + '" title="' + esc(INFO.botDecision) + '">bot: ' + esc(botDecision.action) + ' — ' + esc(botDecision.reasoning) + '</div>' : '';
  const overruled = botDecision && botDecision.action === 'hold';
  // #70 follow-up: /api/recheck always re-checks the LATEST signal — the
  // button must only render when the shown signal IS that latest one, never
  // on a deep-linked historical view, or a click would re-check a different
  // signal than the one displayed. A past re-check line (if any) still shows

  for (const s of list) tb.appendChild(histRow(s, botDecisions));
  // "load 10 more" pages in older signals beyond the current chart window
  const more = document.getElementById('histMore');
  let oldest = list.length ? list[list.length - 1].time : null;
  more.hidden = !oldest;
  more.onclick = async () => {
    more.disabled = true;
    try {
      const q = new URLSearchParams({ instrument: view.instrument, granularity: view.granularity, limit: '10' });
      if (oldest) q.set('before', oldest);
      const r = await (await fetch('/api/signals?' + q)).json();
      const older = (r && r.signals) || [];
      for (const s of older) tb.appendChild(histRow(s, botDecisions));
      if (older.length) oldest = older[older.length - 1].time;

    } finally { more.disabled = false; }
  };
}

function md(t) {
  let h = esc(t);
  h = h.replace(/\x60\x60\x60[a-z]*\n?([\s\S]*?)\x60\x60\x60/g, '<pre><code>$1</code></pre>');
  h = h.replace(/\x60([^\x60\n]+)\x60/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/(^|\s)\*([^*\n]+)\*(?=\s|$|[.,:;!?])/gm, '$1<i>$2</i>');
  // [text](http(s)://url) -> link (#113). esc() already ran, and only http(s) is
  // matched, so no quote-breakout / javascript: URLs — safe to emit an <a>.
  h = h.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  h = h.replace(/^#{1,4} (.*)$/gm, '<b>$1</b>');
  h = h.replace(/^[-*] /gm, '• ');
  const lines = h.split('\n');
  const out = [];
  let rows = [];
  const flush = () => {
    if (!rows.length) return;
    out.push('<table>' + rows.map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</table>');
    rows = [];
  };
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('|') && t.endsWith('|')) {
      if (/^\|[\s:|-]+\|$/.test(t)) continue; // header separator row
      rows.push(t.slice(1, -1).split('|').map((c) => c.trim()));
    } else {
      flush();
      out.push(line);
    }
  }
  flush();
  return out.join('\n');
}

  return div;
}
// A complete, still-streaming, or partially-arrived trailing TITLE annotation
// must never flash in the bubble — but legit HTML comments (even trailing ones,
// even mid-text title mentions followed by more prose) render. Only the LAST
// comment-start is considered, and only when it is a title annotation that
// runs to the end; the fallback strips bare prefixes of "<!--title:".
const stripTitleTail = (t) => {
  const i = t.lastIndexOf('<!--');
  if (i !== -1) {
    const tail = t.slice(i);
    if (/^<!--\s*title:/.test(tail) && (!tail.includes('-->') || /-->\s*$/.test(tail))) return t.slice(0, i).replace(/\n$/, '');
  }
  return t.replace(/\n?<(?:!(?:-(?:-(?:\s*(?:t(?:i(?:t(?:l(?:e(?::)?)?)?)?)?)?)?)?)?)?$/, '');
};
document.getElementById('chatForm').onsubmit = async (e) => {
  e.preventDefault();
  if (chat.pending) return;
  const input = document.getElementById('chatMsg');
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  chat.pending = true;
  appendMsg('user', message);
  const bubble = appendMsg('assistant', '…');
  try {
    const res = await fetch('/api/chat', { method: 'POST', body: JSON.stringify({
      threadId: chat.threadId, message, tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      instrument: qs.get('instrument') || undefined, granularity: qs.get('granularity') || undefined,
    }) });
    if (!res.ok) { bubble.className = 'msg error'; bubble.textContent = (await res.json()).error; chat.pending = false; return; }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let acc = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === 'thread') chat.threadId = ev.id;
        if (ev.type === 'delta') { acc += ev.text; bubble.innerHTML = md(stripTitleTail(acc)); document.getElementById('msgs').scrollTop = 1e9; }
        if (ev.type === 'title') loadThreads();
        if (ev.type === 'done') { bubble.innerHTML = md(ev.reply); chat.threadId = ev.threadId; }
        if (ev.type === 'error') { bubble.className = 'msg error'; bubble.textContent = ev.error; chat.threadId = ev.threadId ?? chat.threadId; }
      }
    }
  } catch (err) {
    bubble.className = 'msg error';
    bubble.textContent = String(err);
  }
  chat.pending = false;
  loadThreads();
};

// Resizable chat sidebar (#112): drag the main<->chat border, double-click resets.
// Width persists in localStorage; clamped so neither pane collapses; the chart
// (responsive) reflows automatically. Disabled at <=900px (single-column layout).
(function () {
  const app = document.getElementById('app');
  const handle = document.getElementById('asideResize');
  if (!app || !handle) return;
  const DEFAULT = 380, MIN = 280;
  const maxW = () => Math.max(MIN, Math.min(window.innerWidth * 0.6, window.innerWidth - 360));
  const clamp = (w) => Math.max(MIN, Math.min(w, maxW()));
  let curW = DEFAULT;
  const apply = (w) => {
    curW = clamp(w); app.style.setProperty('--aside-w', curW + 'px');
    handle.setAttribute('aria-valuemin', String(MIN)); handle.setAttribute('aria-valuemax', String(Math.round(maxW()))); handle.setAttribute('aria-valuenow', String(Math.round(curW)));
  };
  const saved = parseInt(localStorage.getItem('asideW'), 10);
  apply(Number.isFinite(saved) ? saved : DEFAULT);
  // Keyboard a11y: arrows move the divider (Left widens the sidebar), Home resets.
  handle.addEventListener('keydown', (e) => {
    const STEP = e.shiftKey ? 64 : 16;
    if (e.key === 'ArrowLeft') apply(curW + STEP);
    else if (e.key === 'ArrowRight') apply(curW - STEP);
    else if (e.key === 'Home') { apply(DEFAULT); localStorage.removeItem('asideW'); return; }
    else return;
    e.preventDefault(); localStorage.setItem('asideW', String(curW));
  });
  let dragging = false, rectRight = 0;
  // Shared stop: also fires on window blur so a mouseup OUTSIDE the window can't
  // leave the drag (and the col-resize cursor / user-select:none) stuck on.
  const stopDrag = () => {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging'); document.body.classList.remove('resizing');
    localStorage.setItem('asideW', String(curW));
  };
  handle.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); dragging = true; rectRight = app.getBoundingClientRect().right; // cached: no layout read per move
    handle.classList.add('dragging'); document.body.classList.add('resizing');
  });
  window.addEventListener('mousemove', (e) => { if (dragging) apply(rectRight - e.clientX); });
  window.addEventListener('mouseup', stopDrag);
  window.addEventListener('blur', stopDrag);
  // Re-clamp on viewport resize so a previously-wide sidebar can't push the main
  // column below its minimum when the window narrows (apply() re-runs the clamp).
  window.addEventListener('resize', () => { if (app.style.getPropertyValue('--aside-w')) apply(curW); });
  handle.addEventListener('dblclick', () => { apply(DEFAULT); localStorage.removeItem('asideW'); });
})();

// #126: chat sidebar is collapsible, collapsed by default (no dead column when
// idle). State persists; the chart redraws to fill the reclaimed width.
(function initChatToggle() {
  const app = document.getElementById('app');
  const btn = document.getElementById('chatToggle');
  const open = localStorage.getItem('chatOpen') === '1'; // default collapsed
  const apply = (isOpen) => {
    app.classList.toggle('chat-collapsed', !isOpen);
    btn.classList.toggle('on', isOpen);
    btn.setAttribute('aria-expanded', String(isOpen));
    btn.title = isOpen ? 'hide chat copilot' : 'show chat copilot';
    // let the chart pick up its new width
    window.dispatchEvent(new Event('resize'));
  };
  apply(open);
  btn.addEventListener('click', () => {
    const next = app.classList.contains('chat-collapsed');
    localStorage.setItem('chatOpen', next ? '1' : '0');
    apply(next);
  });
})();
