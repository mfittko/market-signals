# Prototype infrastructure. Postgres is the only container; the Go API, the
# worker and the Next.js console run on the host (see scripts/dev.sh).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ms
      POSTGRES_PASSWORD: ms
      POSTGRES_DB: ms
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - msplatform-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms -d ms"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  msplatform-pg:
